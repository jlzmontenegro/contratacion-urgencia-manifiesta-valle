name: Auditar cobertura

# Auditoria a peticion, sin correr el colector: sirve para comprobar la
# cobertura en cualquier momento sin tocar los datos.
#
# NO tiene horario propio. La auditoria de verdad va dentro de 'Actualizar
# monitoreo', que la ejecuta en cada corrida ANTES de publicar y aborta la
# publicacion si encuentra huecos. Alli es candado; aqui solo consulta.
# consulta. En la nube tarda ~2 minutos, no los ~20 que tarda en un equipo
# domestico, y por eso puede correr todos los dias.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verificar cobertura
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          # pipefail es indispensable: sin el, bash devuelve el codigo de salida
          # de 'tee' y no el de Python, y la auditoria "pasaria" siempre.
          set -o pipefail
          python verificar_cobertura.py | tee auditoria.txt

      - name: Dejar el resultado a la vista
        if: always()
        run: |
          echo "### Auditoria de cobertura" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -25 auditoria.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Guardar el informe completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-cobertura
          path: auditoria.txt
          retention-days: 90
