name: Enviar correo de prueba

# Un boton para comprobar que la contrasena de aplicacion quedo bien puesta y
# para ver como llega el correo, sin esperar a que aparezca contratacion nueva.
#
# NO recolecta: lee el datos/tablero.json que ya esta publicado, asi que tarda
# segundos. Y NO toca datos/avisados.csv, de modo que esta prueba no se come los
# avisos de verdad: la contratacion que todavia no se ha notificado se sigue
# notificando en la corrida siguiente.
on:
  workflow_dispatch:
    inputs:
      solo_a:
        description: "Mandar SOLO a esta direccion (recomendado). En blanco manda a las listas de config.json, es decir a todo el equipo."
        required: false
        default: ""

jobs:
  prueba:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enviar la prueba
        env:
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_SERVIDOR: ${{ vars.CORREO_SERVIDOR }}
          CORREO_PUERTO: ${{ vars.CORREO_PUERTO }}
        # Sin pip install: correo.py solo usa la biblioteca estandar. Si algun dia
        # dejara de ser asi, este paso falla y se vera aqui, no en la corrida de
        # las 8:30.
        # OJO: en blanco esto manda a TODA la lista de config.json. Es el mismo
        # fallo que resumen.py ya pago el 13-sep-2026, cuando una prueba lanzada a
        # mano le llego al equipo entero dos veces. Con solo_a puesto va a una sola
        # direccion y el asunto lleva [PRUEBA] delante.
        run: |
          if [ -n "${{ inputs.solo_a }}" ]; then
            python correo.py --prueba --solo-a "${{ inputs.solo_a }}"
          else
            python correo.py --prueba
          fi
