name: Actualizar monitoreo

# Corre el colector en la nube y publica el resultado. Sustituye a la tarea
# programada de Windows, que exigia tener el computador encendido a esa hora.
on:
  schedule:
    # TRES corridas al dia: 6 a.m., 1 p.m. y 8 p.m. hora de Colombia (peticion
    # del usuario, 14-sep-2026). GitHub programa en UTC y Colombia es UTC-5, sin
    # horario de verano. Eran dos, a las 8:30 y 20:30; con tres, el hueco mayor
    # baja de doce a diez horas y la contratacion firmada por la manana se ve el
    # mismo dia al mediodia.
    #
    # EL MINUTO :07 NO ES CAPRICHO. GitHub retrasa y a veces DESCARTA las
    # ejecuciones programadas cuando sus servidores van cargados, y los minutos
    # redondos -en punto y a y media- son los mas congestionados porque es cuando
    # programa todo el mundo. Paso el 14-sep-2026: la corrida de las 20:30 salio
    # cinco horas tarde y la de las 8:30 no salio nunca. Un minuto raro no lo
    # elimina, pero reduce mucho la cola.
    #
    # OJO: una corrida saltada es INVISIBLE. No falla nada, no hay rojo en
    # Actions, simplemente no existe. Detectarlo sigue sin estar construido.
    #
    # LOS CRON VAN ADELANTADOS CUATRO HORAS A PROPOSITO (16-sep-2026). GitHub no
    # esta retrasando las corridas de vez en cuando: las retrasa TODAS. Medido
    # sobre cinco corridas programadas seguidas: +4h59, +4h24, +3h07, +4h48. La
    # peticion es a las 02:07 para que la corrida real caiga cerca de las 06:07,
    # que es la hora a la que el usuario espera ver datos frescos.
    #
    # Es una COMPENSACION, no un arreglo: el retraso es de GitHub y puede
    # desaparecer sin avisar. Si eso pasa, las corridas saldran cuatro horas
    # antes de lo que dicen los comentarios -02:07, 09:07 y 16:07-, que sigue
    # siendo tres veces al dia bien repartidas y no rompe nada. El hueco mayor
    # entre corridas sigue siendo de diez horas, por debajo de las catorce del
    # vigilante.
    - cron: '7 7  * * *'   # 02:07 Colombia -> con el retraso real, ~06:07
    - cron: '7 14 * * *'   # 09:07 Colombia -> con el retraso real, ~13:07
    - cron: '7 21 * * *'   # 16:07 Colombia -> con el retraso real, ~20:07
  # Revisar una operacion en github.com debe verse en la pagina enseguida, no en la
  # corrida de dentro de doce horas: quien edita el archivo espera que su decision
  # llegue a los demas. Solo dispara con ESE archivo, asi que los commits de datos
  # que hace este mismo flujo no se retroalimentan.
  push:
    paths:
      - "revisiones.csv"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions

# Sin esto el token no puede escribir en el repositorio y el push falla.
permissions:
  contents: write

concurrency:
  # Si una corrida se demora y entra la siguiente, no se pisan: la segunda espera.
  # Importa mas con dos corridas diarias, y sobre todo si alguien lanza una a mano
  # desde Actions mientras corre la programada: dos procesos escribiendo los mismos
  # CSV y empujando al mismo tiempo dejarian el repositorio en conflicto.
  group: actualizar-monitoreo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      # El runner viene en UTC y el colector sella todo con datetime.now(): sin
      # esto la corrida de las 20:30 de Colombia se archiva con la fecha del dia
      # siguiente (01:30 UTC) y la portada titularia 'Novedades del 20/08' a las
      # ocho de la noche del 19. Ademas el sello que la pagina compara contra la
      # hora del navegador quedaba cinco horas adelantado.
      TZ: America/Bogota
      # Sin esto, Python amortigua la salida por bloques al no escribir a una
      # terminal y el registro de Actions llega VACIO si la corrida se corta por
      # tiempo: el 19-ago-2026 una corrida se atasco 25 minutos y no dejo ni una
      # linea con que saber en que fuente se quedo.
      PYTHONUNBUFFERED: "1"
    # Una corrida sana tarda 3 minutos. Si datos.gov.co limita las peticiones,
    # el colector se queda reintentando; sin este tope la corrida podria seguir
    # hasta el limite de GitHub, que son 6 horas.
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el colector
        env:
          # Opcional: un app token de datos.gov.co evita el limite de peticiones
          # anonimas. Se configura en Settings > Secrets > Actions.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python colector.py

      # EL CANDADO. Si el colector dejo de capturar contratacion de alguna
      # entidad vigilada, este paso falla y la publicacion no ocurre: es
      # preferible que el sitio muestre los datos de ayer, completos, a que
      # muestre los de hoy con huecos que nadie ve.
      - name: Auditar cobertura antes de publicar
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          # pipefail es indispensable: sin el, bash devuelve el codigo de salida
          # de 'tee' y no el de Python, y la auditoria "pasaria" siempre.
          set -o pipefail
          python verificar_cobertura.py | tee auditoria.txt

      # Avisa por correo de lo que aparecio. Va DESPUES de la auditoria -si el
      # candado salta no se avisa de datos que no se van a publicar- y ANTES de
      # publicar, para que datos/avisados.csv viaje en el mismo commit que los
      # datos. Al reves, una segunda corrida del mismo dia encontraria la
      # bitacora vacia y repetiria todos los avisos.
      #
      # continue-on-error a proposito: publicar los datos no puede depender de
      # que el servidor de correo responda. El paso sale en rojo si falla, que
      # es lo que hace falta para enterarse.
      - name: Avisar por correo
        continue-on-error: true
        env:
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_SERVIDOR: ${{ vars.CORREO_SERVIDOR }}
          CORREO_PUERTO: ${{ vars.CORREO_PUERTO }}
        run: python correo.py

      - name: Publicar los cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          # Con la hora, no solo la fecha: hay dos commits por dia y el log es la
          # memoria del proyecto.
          git commit -m "Actualizacion automatica del tablero $(date -u -d '-5 hours' '+%Y-%m-%d %H:%M')"
          # Otra corrida pudo haber publicado mientras tanto. Los datos NO se
          # fusionan archivo por archivo: cada corrida los regenera enteros, asi que
          # ante un conflicto manda esta corrida, que es la mas reciente. Un rebase
          # a secas fallaba con "could not apply" y dejaba la recoleccion sin
          # publicar aunque el colector y la auditoria hubieran ido bien.
          for intento in 1 2 3; do
            git fetch origin main || true
            if git rebase -X theirs origin/main; then
              if git push; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Reintento de publicacion $intento"
            sleep 5
          done
          echo "No se pudo publicar tras tres intentos."
          exit 1

      - name: Resumen de la corrida
        if: always()
        run: |
          echo "### Monitoreo" >> $GITHUB_STEP_SUMMARY
          if [ -f datos/estado.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat datos/estado.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Auditoria de cobertura" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 auditoria.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null \
            || echo "(la auditoria no alcanzo a ejecutarse)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Se guarda tambien cuando falla: si el candado salta, este archivo es lo
      # que dice que entidad se quedo corta.
      - name: Guardar el informe de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ github.run_number }}
          path: auditoria.txt
          retention-days: 90
          if-no-files-found: ignore
