name: Actualizar monitoreo

# Corre el colector en la nube y publica el resultado. Sustituye a la tarea
# programada de Windows, que exigia tener el computador encendido a esa hora.
on:
  schedule:
    # 08:30 hora de Colombia. GitHub programa en UTC y Colombia es UTC-5.
    # GitHub puede retrasar las ejecuciones programadas cuando hay mucha carga;
    # para un seguimiento diario eso es irrelevante.
    - cron: '30 13 * * *'
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions

# Sin esto el token no puede escribir en el repositorio y el push falla.
permissions:
  contents: write

concurrency:
  # Si una corrida se demora y entra la del dia siguiente, no se pisan.
  group: actualizar-monitoreo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # Una corrida sana tarda 3 minutos. Si datos.gov.co limita las peticiones,
    # el colector se queda reintentando; sin este tope la corrida podria seguir
    # hasta el limite de GitHub, que son 6 horas.
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el colector
        env:
          # Opcional: un app token de datos.gov.co evita el limite de peticiones
          # anonimas. Se configura en Settings > Secrets > Actions.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python colector.py

      # EL CANDADO. Si el colector dejo de capturar contratacion de alguna
      # entidad vigilada, este paso falla y la publicacion no ocurre: es
      # preferible que el sitio muestre los datos de ayer, completos, a que
      # muestre los de hoy con huecos que nadie ve.
      - name: Auditar cobertura antes de publicar
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          # pipefail es indispensable: sin el, bash devuelve el codigo de salida
          # de 'tee' y no el de Python, y la auditoria "pasaria" siempre.
          set -o pipefail
          python verificar_cobertura.py | tee auditoria.txt

      - name: Publicar los cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          git commit -m "Actualizacion automatica del tablero $(date -u -d '-5 hours' +%Y-%m-%d)"
          # Otra corrida pudo haber empujado mientras tanto
          git pull --rebase --autostash
          git push

      - name: Resumen de la corrida
        if: always()
        run: |
          echo "### Monitoreo" >> $GITHUB_STEP_SUMMARY
          if [ -f datos/estado.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat datos/estado.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Auditoria de cobertura" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 auditoria.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null \
            || echo "(la auditoria no alcanzo a ejecutarse)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Se guarda tambien cuando falla: si el candado salta, este archivo es lo
      # que dice que entidad se quedo corta.
      - name: Guardar el informe de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ github.run_number }}
          path: auditoria.txt
          retention-days: 90
          if-no-files-found: ignore
