name: Actualizar monitoreo

# Corre el colector en la nube y publica el resultado. Sustituye a la tarea
# programada de Windows, que exigia tener el computador encendido a esa hora.
on:
  schedule:
    # Cada 12 horas: 08:30 y 20:30 hora de Colombia. GitHub programa en UTC y
    # Colombia es UTC-5, sin horario de verano. Dos corridas porque SECOP publica
    # a lo largo del dia y una urgencia manifiesta firmada por la manana se veia
    # hasta el dia siguiente.
    # GitHub puede retrasar las ejecuciones programadas cuando hay mucha carga;
    # a esta cadencia eso es irrelevante.
    - cron: '30 13 * * *'   # 08:30 Colombia
    - cron: '30 1  * * *'   # 20:30 Colombia (del dia anterior en UTC)
  # Revisar una operacion en github.com debe verse en la pagina enseguida, no en la
  # corrida de dentro de doce horas: quien edita el archivo espera que su decision
  # llegue a los demas. Solo dispara con ESE archivo, asi que los commits de datos
  # que hace este mismo flujo no se retroalimentan.
  push:
    paths:
      - "revisiones.csv"
  workflow_dispatch:        # permite lanzarlo a mano desde la pestana Actions

# Sin esto el token no puede escribir en el repositorio y el push falla.
permissions:
  contents: write

concurrency:
  # Si una corrida se demora y entra la siguiente, no se pisan: la segunda espera.
  # Importa mas con dos corridas diarias, y sobre todo si alguien lanza una a mano
  # desde Actions mientras corre la programada: dos procesos escribiendo los mismos
  # CSV y empujando al mismo tiempo dejarian el repositorio en conflicto.
  group: actualizar-monitoreo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      # El runner viene en UTC y el colector sella todo con datetime.now(): sin
      # esto la corrida de las 20:30 de Colombia se archiva con la fecha del dia
      # siguiente (01:30 UTC) y la portada titularia 'Novedades del 20/08' a las
      # ocho de la noche del 19. Ademas el sello que la pagina compara contra la
      # hora del navegador quedaba cinco horas adelantado.
      TZ: America/Bogota
      # Sin esto, Python amortigua la salida por bloques al no escribir a una
      # terminal y el registro de Actions llega VACIO si la corrida se corta por
      # tiempo: el 19-ago-2026 una corrida se atasco 25 minutos y no dejo ni una
      # linea con que saber en que fuente se quedo.
      PYTHONUNBUFFERED: "1"
    # Una corrida sana tarda 3 minutos. Si datos.gov.co limita las peticiones,
    # el colector se queda reintentando; sin este tope la corrida podria seguir
    # hasta el limite de GitHub, que son 6 horas.
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el colector
        env:
          # Opcional: un app token de datos.gov.co evita el limite de peticiones
          # anonimas. Se configura en Settings > Secrets > Actions.
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python colector.py

      # EL CANDADO. Si el colector dejo de capturar contratacion de alguna
      # entidad vigilada, este paso falla y la publicacion no ocurre: es
      # preferible que el sitio muestre los datos de ayer, completos, a que
      # muestre los de hoy con huecos que nadie ve.
      - name: Auditar cobertura antes de publicar
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          # pipefail es indispensable: sin el, bash devuelve el codigo de salida
          # de 'tee' y no el de Python, y la auditoria "pasaria" siempre.
          set -o pipefail
          python verificar_cobertura.py | tee auditoria.txt

      - name: Publicar los cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          # Con la hora, no solo la fecha: hay dos commits por dia y el log es la
          # memoria del proyecto.
          git commit -m "Actualizacion automatica del tablero $(date -u -d '-5 hours' '+%Y-%m-%d %H:%M')"
          # Otra corrida pudo haber empujado mientras tanto
          git pull --rebase --autostash
          git push

      - name: Resumen de la corrida
        if: always()
        run: |
          echo "### Monitoreo" >> $GITHUB_STEP_SUMMARY
          if [ -f datos/estado.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat datos/estado.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Auditoria de cobertura" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -20 auditoria.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null \
            || echo "(la auditoria no alcanzo a ejecutarse)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Se guarda tambien cuando falla: si el candado salta, este archivo es lo
      # que dice que entidad se quedo corta.
      - name: Guardar el informe de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ github.run_number }}
          path: auditoria.txt
          retention-days: 90
          if-no-files-found: ignore
