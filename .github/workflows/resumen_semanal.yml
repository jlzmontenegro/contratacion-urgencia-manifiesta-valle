name: Resumen semanal

# Los lunes a las 9:37 de Colombia, un informe de la semana que acaba de
# terminar: cuanto se contrato, en que municipios, lo mas grande, y el mapa
# dibujado como PNG.
#
# DESPUES de la primera recoleccion del dia, A PROPOSITO: esa arranca a las 6:07
# y tarda unos seis minutos. Si el resumen saliera antes, leeria el tablero.json
# de la noche anterior y contaria una semana incompleta sin que nadie lo notara.
# Van tres horas de margen por si GitHub retrasa la recoleccion, que lo hace.
#
# El minuto :37 y no :30 por lo mismo que en actualizar.yml: los minutos
# redondos son los mas congestionados y GitHub descarta corridas cuando va
# cargado. Paso el 14-sep-2026.
#
# No recolecta y no toca datos/avisados.csv: es un informe, no un aviso. De cada
# contrato ya se avisa el dia que aparece.
on:
  schedule:
    # Adelantado cuatro horas igual que los del colector (16-sep-2026): GitHub
    # retrasa TODAS las corridas entre tres y cinco horas, asi que pedir las
    # 05:37 es lo que hace que el correo salga cerca de las 09:37.
    #
    # Lo que hay que conservar no es la hora sino el ORDEN: el resumen tiene que
    # correr DESPUES de la primera recoleccion del dia o leeria el tablero.json
    # de anoche y contaria una semana incompleta sin que nadie lo notara. Se
    # adelantaron los dos por igual, asi que la distancia entre ellos sigue
    # siendo de tres horas y media, la misma de antes.
    - cron: '37 10 * * 1'   # lunes 05:37 Colombia -> con el retraso real, ~09:37
  workflow_dispatch:
    inputs:
      solo_a:
        description: >-
          Probar: mandar solo a esta direccion. En blanco, va a todo
          para_resumen de config.json (el envio de verdad).
        required: false
        default: ''

jobs:
  resumen:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 8
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Pillow es lo unico que hace falta: el mapa se dibuja aqui, no en un
      # navegador. Se instala solo esa, no todo requirements.txt, porque este
      # flujo no consulta la API ni usa pandas.
      - name: Instalar Pillow
        run: pip install Pillow

      - name: Enviar el resumen
        env:
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_REMITENTE: ${{ secrets.CORREO_REMITENTE }}
          CORREO_SERVIDOR: ${{ vars.CORREO_SERVIDOR }}
          CORREO_PUERTO: ${{ vars.CORREO_PUERTO }}
        run: python resumen.py ${{ inputs.solo_a && format('--solo-a {0}', inputs.solo_a) || '' }}
